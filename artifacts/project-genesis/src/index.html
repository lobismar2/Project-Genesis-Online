<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Genesis Online</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; }

    #game-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      position: relative;
    }

    #game-screen.active { display: flex; flex-direction: column; align-items: center; justify-content: center; }

    #hub-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #667eea;
      color: white;
      transition: all 0.3s ease;
    }

    button:hover { transform: scale(1.05); background: #764ba2; }
    button:active { transform: scale(0.95); }

    .faction-selector {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .faction-selector button {
      padding: 10px 20px;
      font-size: 14px;
    }

    #joystick {
      width: 100px;
      height: 100px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid white;
      border-radius: 50%;
      position: absolute;
      bottom: 30px;
      left: 30px;
      touch-action: none;
      cursor: grab;
    }

    #joystick:active { cursor: grabbing; }

    #nav-left, #nav-right {
      position: absolute;
      width: 60px;
      height: 60px;
      background: rgba(255, 255, 255, 0.3);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 24px;
      top: 50%;
      transform: translateY(-50%);
    }

    #nav-left { left: 20px; }
    #nav-right { right: 20px; }

    #open-panel {
      position: absolute;
      bottom: 30px;
      right: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
    }

    #panel {
      display: none;
      position: absolute;
      right: 0;
      top: 0;
      width: 300px;
      height: 100vh;
      background: rgba(26, 26, 26, 0.95);
      border-left: 2px solid #667eea;
      padding: 20px;
      overflow-y: auto;
      z-index: 1000;
    }

    #panel.visible { display: block; }

    #close-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 40px;
      height: 40px;
      padding: 0;
    }

    #combat-ui {
      display: none;
      position: absolute;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #667eea;
      text-align: center;
      min-width: 200px;
    }

    #combat-ui.visible { display: block; }

    .enemy {
      position: absolute;
      width: 50px;
      height: 50px;
      background: red;
      border-radius: 50%;
      cursor: pointer;
      top: 150px;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .enemy:hover { opacity: 1; }
  </style>
</head>
<body>
  <div id="hub-screen">
    <h1>Project Genesis Online</h1>
    <button id="button-hub-play" data-testid="button-hub-play">Play</button>
  </div>

  <div id="game-screen" data-testid="game-screen">
    <div class="faction-selector" data-testid="faction-select">
      <button class="faction-btn">Faction 1</button>
      <button class="faction-btn">Faction 2</button>
      <button class="faction-btn">Faction 3</button>
    </div>

    <div id="joystick" data-testid="joystick"></div>
    <button id="nav-left" data-testid="nav-left">←</button>
    <button id="nav-right" data-testid="nav-right">→</button>
    <button id="open-panel" data-testid="open-panel">☰</button>

    <div id="panel" data-testid="panel">
      <h2>Game Panel</h2>
      <button id="close-panel" data-testid="close-panel">×</button>
      <p>Game status and information goes here</p>
    </div>

    <div id="combat-ui" data-testid="combat-ui">
      <h3>Combat Mode</h3>
      <p>Enemy Engaged!</p>
    </div>

    <div class="enemy" data-testid="enemy"></div>
  </div>

  <script>
    // Hub play button
    document.getElementById('button-hub-play').addEventListener('click', () => {
      document.getElementById('hub-screen').style.display = 'none';
      document.getElementById('game-screen').classList.add('active');
    });

    // Faction selection
    document.querySelectorAll('.faction-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        console.log('Faction selected');
      });
    });

    // Navigation buttons
    document.getElementById('nav-left').addEventListener('click', () => {
      console.log('Navigate left');
    });

    document.getElementById('nav-right').addEventListener('click', () => {
      console.log('Navigate right');
    });

    // Panel functionality
    document.getElementById('open-panel').addEventListener('click', () => {
      document.getElementById('panel').classList.add('visible');
    });

    document.getElementById('close-panel').addEventListener('click', () => {
      document.getElementById('panel').classList.remove('visible');
    });

    // Enemy interaction
    document.querySelector('.enemy').addEventListener('click', () => {
      document.getElementById('combat-ui').classList.add('visible');
      setTimeout(() => {
        document.getElementById('combat-ui').classList.remove('visible');
      }, 3000);
    });

    // Joystick events
    const joystick = document.getElementById('joystick');
    joystick.addEventListener('pointerdown', (e) => {
      console.log('Joystick pointerdown');
    });
    joystick.addEventListener('pointerup', (e) => {
      console.log('Joystick pointerup');
    });
    joystick.addEventListener('pointercancel', (e) => {
      console.log('Joystick pointercancel');
    });
  </script>
</body>
</html>
